[package]
name = "qonnect"
version = "0.1.0"
edition = "2021"
description = "Qobuz Connect controller for Linux: browse your Qobuz library in the browser, play it on a Connect device"
license = "MIT"

[dependencies]
axum = "0.8"
futures-util = "0.3"
md5 = "0.7"
qobuz-connect = "0.1.3"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
